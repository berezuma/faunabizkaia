<style>
/* ===========================================================================
   «MARRA», bigarrena
   Orri honen protagonista ere marra bat da, baina etzanda dago: gainean
   bizirik iritsitakoak, azpian hilda. Marra hori ez da metafora bat —
   iturriko eremu bat da, `SARTZEKO EGOERA`, bi balio besterik ez dituena.

   Kolore-sistema bi kolorez osatuta dago:
     hezurra    → animalia bat, besterik gabe
     oxidoa     → ez zen bizirik atera
   Oxidoa datuek erabakitzen dute, ez diseinuak.

   Tipografia natura-historiako plaka zahar batena da: Fraunces izenburuetan
   (bere ardatz bigun eta okerrarekin) eta Source Serif 4 irakurketan eta
   grafikoetan. Izen zientifikoak etzanez, konbentzioak agintzen duen bezala.
=========================================================================== */
:root{
  color-scheme: light;

  --night:#0e1a15; --night-2:#15241d; --night-3:#24392e;
  --moss:#8ca08f; --moss-dim:#4a5f53;
  --bone:#efe9dc;
  --oxide:#c0552f;        /* ilunean */
  --oxide-soft:#9a3f1f;   /* argian: kontraste nahikoa testu eta barretarako */

  --page:#e9e6dc; --page-2:#f4f1e9; --ink:#12201a; --ink-2:#3d5349; --muted:#6d8073;
  --rule:#d2cdc0;

  /* Marraren altuera eszenan: bizirik iritsitakoak gainean, eta azpian
     geratzen den hirurenak hilda iristen direnentzat ematen du lekua. */
  --line-y:46%;

  --disp:"Fraunces",Georgia,"Times New Roman",serif;
  --read:"Source Serif 4",Georgia,"Times New Roman",serif;

  --ease:cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:var(--read); font-size:17.5px; line-height:1.62;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4,.disp{font-family:var(--disp); font-weight:600; font-variation-settings:"SOFT" 30,"WONK" 1;
  letter-spacing:-.012em; line-height:1.1; margin:0}
p{margin:0 0 1.1em}
a{color:inherit; text-decoration-thickness:1px; text-underline-offset:.18em}
b,strong{font-weight:650}
i,em,.sci{font-style:italic}
:focus-visible{outline:2px solid var(--ink); outline-offset:3px; border-radius:2px}
.hero :focus-visible,.stage :focus-visible,.foot :focus-visible{outline-color:var(--oxide)}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation-duration:.01ms!important; transition-duration:.01ms!important}
}
.skip{position:absolute; left:-9999px; top:0; background:var(--oxide); color:var(--bone);
  padding:10px 16px; font-family:var(--disp); z-index:99}
.skip:focus{left:12px; top:12px}

/* JavaScriptik gabeko bertsioa: paper zuri bat baino hobea da beti. */
.nojs{max-width:62ch; margin:0 auto; padding:48px 24px; font-size:1.05rem}
.nojs p{margin-bottom:1.4em}

/* --- neurria eta orri argien egitura ------------------------------------ */
.wrap{max-width:1180px; margin:0 auto; padding-inline:24px}
.page-sec{position:relative; background:var(--page); padding-block:clamp(72px,11vw,140px)}
.page-sec--pale{background:var(--page-2)}
/* Marrak irakurketa-ataletan jarraitzen du, baina etzanda: atalaren goiko
   ertzean, ildaska fin gisa. */
.page-sec--line::before{content:""; position:absolute; left:0; right:0; top:0;
  height:1px; background:var(--rule); pointer-events:none}
.page-sec .wrap{position:relative; z-index:1}

/* ===================== GOIBURUA ========================================= */
.hero{position:relative; min-height:100svh; background:var(--night); color:var(--bone);
  display:flex; flex-direction:column; overflow:hidden}
#heroCanvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.hero-line{position:absolute; left:0; right:0; top:var(--line-y); height:2px;
  background:var(--bone); opacity:.9}
.hero-inner{position:relative; z-index:2; display:flex; flex-direction:column; flex:1;
  padding:clamp(20px,3vw,34px) 24px clamp(28px,4vw,48px); max-width:1180px; margin:0 auto; width:100%}
.hero-bar{display:flex; align-items:center; justify-content:space-between; gap:16px}
.brand{font-family:var(--read); font-size:.92rem; font-weight:600; color:var(--moss);
  letter-spacing:.01em}
.hero-mid{flex:1; display:flex; flex-direction:column; justify-content:flex-end; padding-block:4vh}
/* Zenbakia marraren gainean eseri behar da: hortik behera hasten da gainerakoa. */
.figure{font-family:var(--disp); font-weight:700; font-variation-settings:"SOFT" 0,"WONK" 0;
  font-size:clamp(3.6rem,13vw,11rem); line-height:.9; letter-spacing:-.03em;
  margin:0 0 .12em}
.figure small{font-size:.2em; font-weight:500; letter-spacing:0; margin-left:.2em; vertical-align:.85em}
.hero h1{font-size:clamp(1.3rem,2.5vw,1.95rem); font-weight:500; max-width:24ch;
  line-height:1.22; letter-spacing:-.008em}
.hero .stand{font-family:var(--read); font-size:clamp(1rem,1.2vw,1.1rem); color:#cfd9cf;
  max-width:54ch; margin-top:1.1em}
.hero .stand b{color:var(--bone); font-weight:650}
.hero-foot{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
  gap:8px 20px; font-family:var(--read); font-size:.86rem; font-weight:500; color:var(--moss)}
.cue{display:flex; align-items:center; gap:9px; white-space:nowrap}
.cue i{display:block; width:1px; height:32px; background:currentColor; opacity:.5;
  animation:drop 2.4s var(--ease) infinite}
@keyframes drop{0%{transform:scaleY(0); transform-origin:top}
  45%{transform:scaleY(1); transform-origin:top}
  55%{transform:scaleY(1); transform-origin:bottom}
  100%{transform:scaleY(0); transform-origin:bottom}}

/* Marratik beherako hutsunea izendatzen duen testua: goiburuan, eskuinean. */
/* Marratik beherako testua eskuineko hirurenean: ezkerrean izenburua dago,
   eta bi gauzek ezin dute leku bera hartu. */
.below{position:absolute; z-index:2; right:max(24px,calc((100vw - 1180px)/2 + 24px));
  top:calc(var(--line-y) + 28px); width:min(24ch,30vw); margin:0; text-align:right;
  font-family:var(--read); font-size:.92rem; font-weight:500; line-height:1.5; color:#9fb3a3}
.below b{color:var(--bone); font-weight:650}
@media (max-width:980px){ .below{display:none} }

@media (max-width:820px){
  .hero-mid{flex:0 0 auto; margin-top:auto; padding-block:2vh 0}
  .hero h1{max-width:none}
  .hero-foot{font-size:.78rem; margin-top:auto}
  .cue i{height:24px}
}

/* --- hizkuntza aldatzailea ---------------------------------------------- */
.seg{display:inline-flex; border:1px solid currentColor; border-radius:999px; overflow:hidden; opacity:.85}
.seg button{appearance:none; background:none; border:0; color:inherit; cursor:pointer;
  font-family:var(--read); font-size:.8rem; font-weight:600; letter-spacing:.005em;
  padding:6px 14px; line-height:1.4}
.hero .seg{color:var(--moss)}
.hero .seg button[aria-pressed="true"]{background:var(--moss); color:var(--night)}
.tool .seg button[aria-pressed="true"],.search .seg button[aria-pressed="true"]{
  background:var(--ink); color:var(--page-2)}

/* ===================== ESZENA (scrollytelling) ========================== */
.stage{position:relative; background:var(--night); color:var(--bone)}
.stage-gfx{position:sticky; top:0; height:100svh; width:100%; overflow:hidden}
#wallCanvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.stage-hud{position:absolute; left:24px; top:22px; z-index:3;
  font-family:var(--read); font-size:.84rem; font-weight:500; color:var(--moss);
  display:flex; gap:22px; align-items:baseline}
.stage-hud .yr{font-family:var(--disp); font-size:clamp(1.9rem,4.4vw,3rem); font-weight:700;
  font-variation-settings:"SOFT" 0,"WONK" 0;
  line-height:.95; color:var(--bone); letter-spacing:-.02em}
.stage-hud dl{margin:0; display:flex; gap:20px}
.stage-hud div{display:flex; flex-direction:column; gap:2px}
.stage-hud dt{color:var(--moss); font-size:.74rem}
.stage-hud dd{margin:0; font-size:1.02rem; font-weight:650; color:var(--bone)}

.steps{position:relative; z-index:2; pointer-events:none}
.step{min-height:96svh; display:flex; align-items:center;
  padding-inline:24px; margin-inline:auto; max-width:1180px}
.step > div{
  pointer-events:auto;
  margin-left:auto;                     /* eskuinaldean: grafikoak ezkerra behar du */
  width:min(32ch,100%);
  background:rgba(14,26,21,.9);
  backdrop-filter:blur(7px);
  border-left:2px solid var(--oxide);
  padding:20px 22px;
  font-size:1.02rem; line-height:1.56; color:#cfd9cf;
  opacity:.32; transform:translateY(10px);
  transition:opacity .5s var(--ease), transform .5s var(--ease);
}
.step.on > div{opacity:1; transform:none}
.stepno{font-family:var(--read); font-size:.74rem; font-weight:600; color:var(--moss);
  margin:0 0 .5em; opacity:.8}
.step b{color:var(--bone); font-weight:650}
.step em{color:var(--oxide); font-style:normal; font-weight:650}
.step .sci{color:var(--moss); font-style:italic; font-weight:400}
.step h3{font-size:1.3rem; margin-bottom:.5em; color:var(--bone)}
.step p:last-child{margin-bottom:0}
@media (max-width:820px){
  .step{min-height:100svh; align-items:flex-end; padding:0 16px 5svh}
  .step > div{margin-left:0; width:min(46ch,100%); opacity:.25; font-size:.98rem}
  .step h3{font-size:1.16rem}
  .stage-hud{left:16px; top:12px; flex-direction:column; align-items:flex-start; gap:6px}
  .stage-hud dl{gap:16px}
  .stage-hud dt{font-size:.68rem}
  .stage-hud dd{font-size:.95rem}
  .stage-hud .yr{font-size:1.9rem}
}

/* ===================== ORRI ARGIAK ====================================== */
.eyebrow{font-family:var(--read); font-size:.88rem; font-weight:650; color:var(--muted);
  margin:0 0 .9em}
.page-sec h2{font-size:clamp(1.85rem,4vw,2.9rem); max-width:19ch; margin-bottom:.5em; font-weight:600}
.lede{font-size:1.18rem; color:var(--ink-2); max-width:58ch; margin-bottom:2em}
.prose p{max-width:62ch}
.prose .sci{color:var(--muted)}

/* Aipu handia: hemen bakarrik uzten diot testuari irudia izaten. */
.pull{font-family:var(--disp); font-weight:500; font-size:clamp(1.35rem,2.5vw,1.9rem);
  line-height:1.2; letter-spacing:-.01em; margin:1.8em 0;
  padding-left:20px; border-left:2px solid var(--oxide-soft)}
@media (min-width:1000px){
  .pull{float:right; width:min(26ch,34%); margin:.4em 0 1.6em 56px}
}

/* --- bizirauteko eskailera ---------------------------------------------- */
.ladder{margin-top:2.4em; max-width:720px}
.lrow{display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--rule)}
.lrow .why{flex:0 0 13.5em; font-weight:600}
.lrow .track{flex:1; height:11px; background:var(--rule); border-radius:1px; position:relative; min-width:60px}
.lrow .track i{position:absolute; left:0; top:0; height:100%; background:var(--night-3);
  border-radius:1px}
.lrow .pc{flex:0 0 4.2em; text-align:right; font-weight:650; font-variant-numeric:tabular-nums}
.lrow .n{flex:0 0 7em; text-align:right; color:var(--muted); font-size:.92rem}
.lrow.best .track i{background:var(--night)}
.lrow.worst .pc{color:var(--oxide-soft)}
.lrow.worst .track i{background:var(--oxide-soft)}
@media (max-width:720px){
  .lrow{flex-wrap:wrap; gap:6px 10px}
  .lrow .why{flex:1 0 100%}
  .lrow .n{flex:0 0 auto}
}

/* --- grafikoak ----------------------------------------------------------- */
.chartbox{position:relative}
.chartbox[tabindex]:focus-visible{outline:2px solid var(--ink); outline-offset:6px; border-radius:2px}
.chart{display:block; width:100%; height:auto}
.tip{position:absolute; pointer-events:none; opacity:0; transition:opacity .12s;
  background:var(--night); color:var(--bone); font-family:var(--read); font-size:.82rem;
  line-height:1.45; padding:7px 10px; border-radius:3px; white-space:nowrap; z-index:4}
.tip.on{opacity:1}
.tip em{color:var(--oxide); font-style:normal; font-weight:650}
.tip .sci{color:var(--moss)}
.legend{display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:12px;
  font-family:var(--read); font-size:.84rem; font-weight:500; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:7px}
.legend i{width:11px; height:11px; display:block; border-radius:2px}
.legend b{color:var(--ink); font-weight:650}

.tool{margin-top:2em; background:var(--page-2); border:1px solid var(--rule); border-radius:3px;
  padding:18px 18px 14px}
.page-sec--pale .tool{background:var(--page)}
.tool-top{display:flex; flex-wrap:wrap; align-items:center; gap:10px 26px; margin-bottom:14px}
.read-out{display:flex; flex-direction:column; line-height:1.2}
.read-out .v{font-family:var(--disp); font-weight:700; font-size:1.4rem; letter-spacing:-.01em}
.read-out .k{font-family:var(--read); font-size:.8rem; color:var(--muted); font-weight:600}
.tool .sp{flex:1}
.tool .seg{color:var(--ink-2)}

/* --- bilaketa eta taulak ------------------------------------------------ */
.search{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin:1.6em 0 .8em}
.search .field{position:relative; flex:1 1 260px; display:flex}
.search input{flex:1; min-width:0; font-family:var(--read); font-size:1.05rem;
  padding:11px 34px 11px 14px; background:var(--page-2); color:var(--ink);
  border:1px solid var(--rule); border-radius:3px}
.search input:focus{border-color:var(--ink); outline:none}
.search .field:focus-within{outline:2px solid var(--ink); outline-offset:2px; border-radius:4px}
#qclear{position:absolute; right:4px; top:50%; transform:translateY(-50%);
  appearance:none; border:0; background:none; color:var(--muted); cursor:pointer;
  font-size:1.2rem; line-height:1; padding:6px 8px; visibility:hidden}
.search input:not(:placeholder-shown) ~ #qclear{visibility:visible}
#qclear:hover{color:var(--ink)}
.search .seg{color:var(--ink-2)}
.ghost{appearance:none; cursor:pointer; font-family:var(--read); font-size:.82rem;
  font-weight:600; padding:7px 15px; border-radius:999px; line-height:1.4;
  border:1px solid var(--rule); background:var(--page-2); color:var(--ink-2)}
.ghost:hover:not(:disabled){border-color:var(--ink); color:var(--ink)}
.ghost:disabled{opacity:.4; cursor:default}
.ghost.ok{border-color:var(--oxide-soft); color:var(--oxide-soft)}
#qcount{margin:0 0 1em; font-family:var(--read); font-size:.86rem; color:var(--muted)}

.tbl{overflow:auto; border:1px solid var(--rule); border-radius:3px; background:var(--page-2)}
table{border-collapse:collapse; width:100%; font-size:.95rem}
th{position:sticky; top:0; background:var(--page-2); text-align:left; font-family:var(--read);
  font-size:.82rem; font-weight:650; color:var(--muted); padding:0;
  border-bottom:1px solid var(--rule); white-space:nowrap; z-index:1}
th button{appearance:none; border:0; background:none; cursor:pointer; width:100%;
  font:inherit; color:inherit; text-align:inherit; padding:10px 12px; display:flex;
  align-items:center; gap:5px}
th.n button{justify-content:flex-end}
th button:hover{color:var(--ink)}
th.on{color:var(--ink)}
th button span{font-size:.7em; opacity:.8}
td{padding:9px 12px; border-bottom:1px solid var(--rule); vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{text-align:right; white-space:nowrap}
td.empty{color:var(--muted)}
td .sci{display:block; color:var(--muted); font-size:.88em; font-style:italic}
/* Kopuruaren barra: 526etik 1era doa, eta mediana 4 da. Lineala izanez gero
   buztan osoa pixel bakarra litzateke; erro karratuak banaketa ikusgai uzten
   du zenbakia faltsutu gabe — zenbakia bera ondoan dago beti. */
.qty{display:inline-block; width:52px; height:7px; margin-right:9px; border-radius:1px;
  background:var(--rule); vertical-align:baseline; position:relative; overflow:hidden}
.qty i{position:absolute; left:0; top:0; height:100%; background:var(--night-3); opacity:.5}

/* Zutabe-barra: espeziearen emaitza, kutxa baten barruan. */
.bar{position:relative; display:inline-block; width:46px; height:9px; border-radius:1px;
  background:var(--rule); vertical-align:baseline; margin-right:8px; overflow:hidden}
.bar i{position:absolute; top:0; height:100%; display:block}
.bar .f{left:0; background:var(--night-3)}
.bar .d{right:0; background:var(--oxide-soft)}

.warn{margin-top:1.2em; font-size:.95rem; color:var(--ink-2); max-width:70ch;
  border-left:2px solid var(--oxide-soft); padding-left:16px}

/* --- sei animaliak -------------------------------------------------------
   Atal hau da orriko bakarra non animalia bat banako bat den, ez puntu bat.
   Hiru zutabe: nor diren, nolakoa den, eta zer dioen erregistroak. */
.six{background:var(--night); color:#cfd9cf}
.six h2{color:var(--bone)}
.six .eyebrow{color:var(--moss)}
.six .lede{color:#a8bdae}
.six-grid{display:grid; gap:28px 36px; margin-top:2.4em;
  grid-template-columns:minmax(150px,200px) minmax(0,1.25fr) minmax(220px,300px);
  align-items:start}
@media (max-width:980px){

  for (let i = 0; i < N; i++){ const g = grp[i]; gIdx[g][gLen[g]++] = i; }
}

/* Eszenaren urratsak. `split`: marrak zer esan nahi duen urrats horretan. */
const SCENE = [
  {split:"none",  mark:"none"},
  {split:"state", mark:"none"},
  {split:"state", mark:"young"},
  {split:"state", mark:"remove"},
  {split:"fate",  mark:"none"}
];

const wallCv = $("#wallCanvas"), wallCtx = wallCv.getContext("2d");
const heroCv = $("#heroCanvas"), heroCtx = heroCv.getContext("2d");

let stepIx = 0, tween = 1, rafId = null, lastTs = 0, plot = null, sizing = false;

function measure(cv, ctx, opts){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = r.width, H = r.height;
  const pl = W * (opts.pl ?? .05), pr = W * (opts.pr ?? .05);
  return {W, H, pl, pr, iw: W - pl - pr, lineY: H * (opts.line ?? .46)};
}

/* Animalia bakoitzari bere laukizuzena. Hilabeteko zutabe bat, eta zutabe
   barruan pilatuta: gora bizirik iritsiak, behera hildakoak. */
function buildTarget(cfg, P){
  const colW = P.iw / NM;
  const w = Math.max(1.1, colW - 1.4);
  /* Laukizuzenaren altuera pilarik altuenak kabitzeko kalkulatzen da, ez
     zenbaki finko batekin: bestela udako gailurrak oihaletik ateratzen ziren. */
  const topRoom = P.lineY - P.H * 0.10;
  const botRoom = P.H - P.lineY - P.H * 0.10;
  const hi = Math.max(1, Math.max(...monLive)), lo = Math.max(1, Math.max(...monDead));
  const all = Math.max(1, Math.max(...monAll));
  /* `unit` = animalia bakoitzak hartzen duen lekua, tartea barne. Pilarik
     altuenak kabitu behar du, eta hortik ateratzen da altuera — ez
     alderantziz. Hala ez dago zutaberik oihaletik ateratzen denik. */
  const unit = Math.min(
    cfg.split === "none" ? topRoom / all : topRoom / hi,
    cfg.split === "none" ? 4.0 : botRoom / lo, 4.0);
  const h = Math.max(0.6, unit * 0.68), gap = unit - h;
  const up = new Float32Array(NM), down = new Float32Array(NM);

  for (let i = 0; i < N; i++){
    const m = R_mon[i];
    const x = P.pl + m * colW + (colW - w) / 2;
    let above;
    if (cfg.split === "none") above = true;
    else if (cfg.split === "state") above = !!R_liv[i];
    else above = isFree(i);                       // "fate": askatuak bakarrik gainean
    toX[i] = x; toW[i] = w; toH[i] = h;
    if (above){ up[m] += h + gap; toY[i] = P.lineY - up[m]; }
    else { toY[i] = P.lineY + down[m]; down[m] += h + gap; }

    grp[i] = cfg.mark === "young" ? (CG[R_cau[i]] === "young" ? 1 : 0)
           : cfg.mark === "remove" ? (CG[R_cau[i]] === "remove" ? 1 : 0)
           : cfg.split === "fate" ? (isFree(i) ? 1 : 2)
           : cfg.split === "state" ? (R_liv[i] ? 0 : 2)
           : 0;
  }
}

const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
/* Kolore-sistemak bi kolore ditu: hezurra (animalia bat) eta oxidoa (ez zen
   bizirik atera). Azpimarratzeko ez da hirugarren kolore bat sartzen —
   gainerakoa ilundu egiten da. Hala sistemak bere esanahia gordetzen du. */
const COL = ["rgba(140,160,143,.55)", "#efe9dc", "#c0552f"];
const COL_DIM = ["rgba(140,160,143,.13)", "#efe9dc", "rgba(192,85,47,.16)"];

function ensurePlot(){
  if (sizing || !plot) return;
  const r = wallCv.getBoundingClientRect();
  if (Math.abs(r.width - plot.W) > .5 || Math.abs(r.height - plot.H) > .5) sizeStage();
}

function paintWall(){
  ensurePlot();
  const P = plot, t = ease(tween), T_ = T[lang];
  const ctx = wallCtx;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, wallCv.width, wallCv.height); ctx.restore();

  const cfg = SCENE[stepIx];
  const pal = cfg.mark === "none" ? COL : COL_DIM;
  for (let g = 0; g < 3; g++){
    const idx = gIdx[g], n = gLen[g];
    if (!n) continue;
    ctx.fillStyle = pal[g];
    ctx.beginPath();
    for (let k = 0; k < n; k++){
      const i = idx[k];
      ctx.rect(fromX[i] + (toX[i]-fromX[i])*t, fromY[i] + (toY[i]-fromY[i])*t,
               fromW[i] + (toW[i]-fromW[i])*t, fromH[i] + (toH[i]-fromH[i])*t);
    }
    ctx.fill();
  }

  /* MARRA. Lehen urratsean ez dago: oraindik ez du ezer esan nahi. */
  if (cfg.split !== "none"){
    const a = Math.min(1, t * 1.6);
    ctx.save(); ctx.globalAlpha = a;
    ctx.strokeStyle = "#efe9dc"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(P.pl * .4, P.lineY); ctx.lineTo(P.W - P.pr * .4, P.lineY); ctx.stroke();
    ctx.restore();
  }

  /* Urte-markak, azpian. */
  ctx.fillStyle = "rgba(140,160,143,.8)";
  ctx.font = `500 ${Math.max(11, P.W*.0095)}px ${READ}`;
  ctx.textAlign = "center";
  const colW = P.iw / NM;
  YEARS.forEach(y => {
    const m0 = (y - YEARS[0]) * 12;
    ctx.fillText(y, P.pl + (m0 + 6) * colW, P.H - 16);
  });
}

function setStep(ix, instant){
  ix = Math.max(0, Math.min(SCENE.length - 1, ix));
  const t = ease(tween);
  for (let i = 0; i < N; i++){
    fromX[i] += (toX[i]-fromX[i])*t; fromY[i] += (toY[i]-fromY[i])*t;
    fromW[i] += (toW[i]-fromW[i])*t; fromH[i] += (toH[i]-fromH[i])*t;
  }
  stepIx = ix;
  buildTarget(SCENE[ix], plot);
  regroup();
  tween = (instant || REDUCED) ? 1 : 0;
  updateHud();
  if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
  lastTs = 0;
  if (tween < 1) rafId = requestAnimationFrame(loop); else paintWall();
}

function loop(ts){
  const now = ts || performance.now();
  if (!lastTs) lastTs = now;
  tween = Math.min(1, tween + (now - lastTs) / 900);
  lastTs = now;
  paintWall();
  rafId = tween < 1 ? requestAnimationFrame(loop) : null;
}

function updateHud(){
  const t = T[lang];
  $("#hudYear").textContent = YEARS[0] + "–" + YEARS[YEARS.length-1];
  $("#hudN").textContent = num(N);
  $("#hudAlive").textContent = num(liveN);
  $("#hudFree").textContent = num(freeN);
  wallCv.setAttribute("aria-label",
    `${t.stageTitle} — ${num(N)} ${t.rN}, ${num(liveN)} ${t.rAlive}, ${num(freeN)} ${t.rFree}`);
}

function stagePads(){
  if (window.innerWidth >= 821) return {pr:.34, line:.46};
  let card = 0;
  document.querySelectorAll(".step > div").forEach(el => card = Math.max(card, el.offsetHeight));
  const h = wallCv.getBoundingClientRect().height || window.innerHeight || 800;
  return {pl:.04, pr:.04, line: Math.max(.22, Math.min(.42, (h - card - h*.09) / h * .62))};
}

function sizeStage(){
  sizing = true;
  plot = measure(wallCv, wallCtx, stagePads());
  buildTarget(SCENE[stepIx], plot);
  regroup();
  fromX.set(toX); fromY.set(toY); fromW.set(toW); fromH.set(toH);
  tween = 1; sizing = false;
  paintWall();
}

/* --- goiburuko horma: eszena bera, isilago, testuaren atzean ------------- */
let heroPrep = null;
function prepHero(){
  const P = measure(heroCv, heroCtx, {pl:.03, pr:.03, line: parseFloat(cssv("--line-y")) / 100});
  heroPrep = {P};
}
function paintHero(prog){
  if (!heroPrep) prepHero();
  const {P} = heroPrep;
  const colW = P.iw / NM, w = Math.max(1.1, colW - 1.4);
  heroCtx.clearRect(0, 0, P.W, P.H);
  const up = new Float32Array(NM), down = new Float32Array(NM);
  const h = Math.max(1, Math.min(2.4, (P.H * .22) / Math.max(...monAll) * 2));
  for (let g = 0; g < 2; g++){
    /* Goiburuan hormak ehundura bat izan behar du, ez protagonista:
       testuak irakurgarri geratu behar du gainean. */
    heroCtx.fillStyle = g ? "rgba(192,85,47,.34)" : "rgba(239,233,220,.20)";
    heroCtx.beginPath();
    for (let i = 0; i < N; i++){
      const live = !!R_liv[i];
      if ((g === 0) !== live) continue;
      const m = R_mon[i], x = P.pl + m * colW + (colW - w) / 2;
      let y;
      if (live){ up[m] += (h + .5) * prog; y = P.lineY - up[m]; }
      else { y = P.lineY + down[m]; down[m] += (h + .5) * prog; }
      heroCtx.rect(x, y, w, h);
    }
    heroCtx.fill();
  }
}
function runHero(){
  prepHero();
  if (REDUCED){ paintHero(1); return; }
  const t0 = performance.now();
  (function frame(ts){
    const p = Math.min(1, (ts - t0) / 1700);
    paintHero(ease(p));
    if (p < 1) requestAnimationFrame(frame);
  })(t0);
}

const READ = '"Source Serif 4", Georgia, serif';

/* --- urratsen testua eta scroll-behatzailea ------------------------------ */
function buildSteps(){
  const n = T[lang].steps.length;
  $("#steps").innerHTML = T[lang].steps.map((s, i) =>
    `<div class="step" data-ix="${i}"><div>` +
    `<p class="stepno">${i + 1}/${n}</p><h3>${s.h}</h3><p>${s.p}</p></div></div>`).join("");
  observeSteps();
}
let stepObs = null;
function observeSteps(){
  if (stepObs) stepObs.disconnect();
  stepObs = new IntersectionObserver(entries => {
    for (const e of entries){
      e.target.classList.toggle("on", e.isIntersecting);
      if (!e.isIntersecting) continue;
      const ix = +e.target.dataset.ix;
      if (ix !== stepIx) setStep(ix);
    }
  }, {rootMargin: "-45% 0px -45% 0px", threshold: 0});
  document.querySelectorAll(".step").forEach(el => stepObs.observe(el));
}

/* ===========================================================================
   Bizirauteko eskailera
=========================================================================== */
function paintLadder(){
  const t = T[lang];
  const max = Math.max(...LADDER.map(e => e.free / e.n));
  $("#ladder").innerHTML = LADDER.map((e, k) => {
    const p = e.free / e.n * 100;

      `<span class="why">${esc(causeName(CAUSES[e.k], lang))}</span>` +

      `<span class="pc">${pc(p)}</span>` +

  }).join("");
}

/* ===========================================================================
   Urteko pultsua — hilabeteak, bost urte bata bestearen gainean
=========================================================================== */
const PW = 1000;
let PH = 340, PPL = 56, PPR = 20, PPT = 24, PPB = 46, PIW = 924, PIH = 270, PK = 1;
const psc = n => Math.round(n * PK * 10) / 10;

function pulseGeom(){
  const w = $("#pulse").getBoundingClientRect().width || PW;
  PK = Math.min(3, Math.max(1, 1000 / w));
  PH = Math.round(340 + (PK - 1) * 180);
  PPL = Math.round(22 + 34 * PK); PPT = Math.round(10 + 14 * PK); PPB = Math.round(16 + 30 * PK);
  PIW = PW - PPL - PPR; PIH = PH - PPT - PPB;
  $("#pulse").setAttribute("viewBox", `0 0 ${PW} ${PH}`);
}

const MONTH = (() => {
  const all = new Int32Array(12), young = new Int32Array(12), rem = new Int32Array(12);
  for (let i = 0; i < N; i++){
    const m = +DATES[i].slice(5,7) - 1;
    all[m]++;
    if (CG[R_cau[i]] === "young") young[m]++;
    if (CG[R_cau[i]] === "remove") rem[m]++;
  }
  return {all, young, rem};
})();

function drawPulse(){
  pulseGeom();
  const t = T[lang];
  const max = Math.max(...MONTH.all) * 1.08;
  const X = m => PPL + (m + .5) / 12 * PIW;
  const Y = v => PPT + PIH - v / max * PIH;
  const bw = PIW / 12 * .62;
  const grid = cssv("--rule"), muted = cssv("--muted"), ink = cssv("--ink");
  const c1 = cssv("--night-3"), c2 = cssv("--oxide-soft");
  let s = "";

  const step = Math.pow(10, Math.floor(Math.log10(max / 4)));
  const st = Math.ceil(max / 4 / step) * step;
  for (let v = 0; v <= max; v += st){
    s += `<line x1="${PPL}" y1="${Y(v).toFixed(1)}" x2="${PW-PPR}" y2="${Y(v).toFixed(1)}" stroke="${grid}" stroke-width="${psc(1)}"/>`;
    s += `<text x="${PPL-psc(10)}" y="${(Y(v)+psc(4)).toFixed(1)}" text-anchor="end" font-size="${psc(12)}" fill="${muted}" font-family='${READ}'>${num(v)}</text>`;
  }
  for (let m = 0; m < 12; m++){
    const x = X(m) - bw/2;
    s += `<rect x="${x.toFixed(1)}" y="${Y(MONTH.all[m]).toFixed(1)}" width="${bw.toFixed(1)}" height="${(PPT+PIH-Y(MONTH.all[m])).toFixed(1)}" fill="${c1}" fill-opacity=".30"/>`;
    s += `<rect x="${x.toFixed(1)}" y="${Y(MONTH.young[m]).toFixed(1)}" width="${(bw*.52).toFixed(1)}" height="${(PPT+PIH-Y(MONTH.young[m])).toFixed(1)}" fill="${c1}"/>`;
    s += `<rect x="${(x+bw*.52).toFixed(1)}" y="${Y(MONTH.rem[m]).toFixed(1)}" width="${(bw*.48).toFixed(1)}" height="${(PPT+PIH-Y(MONTH.rem[m])).toFixed(1)}" fill="${c2}"/>`;
    s += `<text x="${X(m).toFixed(1)}" y="${PH-PPB+psc(20)}" text-anchor="middle" font-size="${psc(12)}" fill="${muted}" font-family='${READ}'>${t.mon[m]}</text>`;
  }
  s += `<line x1="${PPL}" y1="${PPT+PIH}" x2="${PW-PPR}" y2="${PPT+PIH}" stroke="${grid}" stroke-width="${psc(1)}"/>`;
  s += `<rect id="pcursor" x="0" y="${PPT}" width="${bw.toFixed(1)}" height="${PIH}" fill="${ink}" fill-opacity=".08" visibility="hidden"/>`;
  s += `<rect id="phit" x="${PPL}" y="${PPT}" width="${PIW}" height="${PIH}" fill="transparent" style="cursor:crosshair"/>`;

  const svg = $("#pulse");
  svg.innerHTML = s;
  svg.setAttribute("aria-hidden", "true");
  $("#pulsebox").setAttribute("aria-label", t.yearTitle);
  const hit = svg.querySelector("#phit");
  hit.addEventListener("pointermove", pulseMove);
  hit.addEventListener("pointerdown", pulseMove);
  hit.addEventListener("pointerleave", hidePulseTip);

  $("#pulseLegend").innerHTML =
    `<span><i style="background:${c1};opacity:.3"></i>${t.legAll}</span>` +
    `<span><i style="background:${c1}"></i>${t.legYoung}</span>` +
    `<span><i style="background:${c2}"></i>${t.legRemove}</span>`;
}

let pulseM = -1;
function hidePulseTip(){ pulseM = -1; $("#tipP").classList.remove("on");
  const c = document.getElementById("pcursor"); if (c) c.setAttribute("visibility","hidden"); }
function pulseMove(e){
  const svg = $("#pulse"), r = svg.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * PW;
  showMonth(Math.floor((x - PPL) / PIW * 12));
}
function showMonth(m){
  if (m < 0 || m > 11){ hidePulseTip(); return; }
  pulseM = m;
  const t = T[lang], tip = $("#tipP"), svg = $("#pulse"), r = svg.getBoundingClientRect();
  tip.innerHTML = `<div>${t.tipMon.replace("{m}", t.mon[m]).replace("{n}", num(MONTH.all[m]))}</div>` +
    `<div><em>${num(MONTH.young[m])}</em> ${t.legYoung.toLowerCase()} · ${num(MONTH.rem[m])} ${t.legRemove.toLowerCase()}</div>`;
  tip.classList.add("on");
  const bw = PIW / 12 * .62, X = PPL + (m + .5) / 12 * PIW;
  const cur = document.getElementById("pcursor");
  if (cur){ cur.setAttribute("x", (X - bw/2).toFixed(1)); cur.setAttribute("visibility","visible"); }
  const box = $("#pulsebox").getBoundingClientRect();
  const px = r.left - box.left + X / PW * r.width;
  const tw = tip.offsetWidth;
  tip.style.left = Math.max(4, Math.min(box.width - tw - 4, px - tw/2)) + "px";
  tip.style.top = Math.round(r.height * .12) + "px";
}

/* ===========================================================================
   Espezie-taula
=========================================================================== */
const COLL = new Intl.Collator("es", {sensitivity:"base"});
const COLS = [
  {k:"sp",   t:"thSp"},
  {k:"cls",  t:"thCls"},
  {k:"n",    t:"thN",    n:true},
  {k:"live", t:"thLive", n:true},
  {k:"free", t:"thFree", n:true},
  {k:"fate", t:"thFate"}
];
let lastRows = [];

function matchSp(e, needle){
  if (!needle) return true;
  const s = SP[e.i];
  return (s.eu||"").toLowerCase().includes(needle) || (s.es||"").toLowerCase().includes(needle)
      || (s.sci||"").toLowerCase().includes(needle);
}
function passFilt(e){
  const c = clsOf(e.i);
  return filt === "all" || (filt === "bird" && c === CLS_BIRD)
      || (filt === "mam" && c === CLS_MAM) || (filt === "rep" && c === CLS_REP);
}

function paintTable(){
  const t = T[lang], needle = q.trim().toLowerCase();
  let rows = BYSP.filter(e => passFilt(e) && matchSp(e, needle));
  const cmp = {
    sp:  (a,b) => COLL.compare(spName(SP[a.i],lang), spName(SP[b.i],lang)),
    cls: (a,b) => COLL.compare(clsOf(a.i), clsOf(b.i)),
    n:   (a,b) => a.n - b.n,
    live:(a,b) => a.live - b.live,
    free:(a,b) => a.free - b.free,
    fate:(a,b) => (a.free/(a.n||1)) - (b.free/(b.n||1))
  }[sortKey];
  rows = rows.slice().sort((a,b) => sortDir * cmp(a,b) || b.n - a.n);
  lastRows = rows;

  $("#spTable thead").innerHTML = "<tr>" + COLS.map(c => {
    const on = sortKey === c.k, arrow = on ? (sortDir < 0 ? "▾" : "▴") : "";
    return `<th class="${c.n ? "n " : ""}s${on ? " on" : ""}" aria-sort="${on ? (sortDir<0?"descending":"ascending") : "none"}">` +
      `<button type="button" data-sort="${c.k}" aria-label="${esc(t.sortBy.replace("{c}",t[c.t]).replace("{d}", (on&&sortDir>0)?t.sortDesc:t.sortAsc))}">` +
      `${t[c.t]}<span aria-hidden="true">${arrow}</span></button></th>`;
  }).join("") + "</tr>";

  const mx = Math.max(1, ...rows.map(e => e.n));
  $("#spTable tbody").innerHTML = rows.map(e => {
    const s = SP[e.i];
    const f = e.n ? e.free / e.n * 100 : 0, l = e.n ? e.lost / e.n * 100 : 0;
    return `<tr><td>${esc(spName(s, lang))}${s.sci ? `<span class="sci">${esc(s.sci)}</span>` : ""}</td>` +
      `<td>${esc(subName(e.i))}</td>` +
      `<td class="n"><span class="qty" aria-hidden="true">` +
      `<i style="width:${(Math.sqrt(e.n / mx) * 100).toFixed(1)}%"></i></span>${num(e.n)}</td>` +
      `<td class="n">${num(e.live)}</td>` +
      `<td class="n">${num(e.free)}</td>` +
      `<td><span class="bar" aria-hidden="true"><i class="f" style="width:${f.toFixed(1)}%"></i>` +
      `<i class="d" style="width:${l.toFixed(1)}%"></i></span></td></tr>`;
  }).join("") || `<tr><td colspan="6" class="empty">${t.tblEmpty}</td></tr>`;

  const tot = rows.reduce((a,e) => a + e.n, 0);
  $("#qcount").textContent = t.qCount.replace("{n}", num(rows.length)).replace("{m}", num(tot));
  $("#csv").disabled = !rows.length;
  document.querySelectorAll("[data-filt]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.filt === filt)));
  $("#tblLegend").innerHTML =
    `<span><i style="background:${cssv("--night-3")}"></i>${t.legRowFree}</span>` +
    `<span><i style="background:${cssv("--oxide-soft")}"></i>${t.legRowLost}</span>`;
}
const subName = i => { const s = RAW.spSub[i]; return subLabel(s >= 0 ? SUBS[s] : (clsOf(i) || "—"), lang); };

function downloadCsv(){
  const es = lang === "es";
  const head = es
    ? ["especie_es","especie_eu","nombre_cientifico","grupo","llegados","vivos","liberados","muertos_o_sacrificados"]
    : ["espezie_es","espezie_eu","izen_zientifikoa","taldea","iritsiak","bizirik","askatuak","hil_edo_sakrifikatuak"];
  const qq = v => `"${String(v == null ? "" : v).replace(/"/g,'""')}"`;
  const lines = [head.join(",")];
  for (const e of lastRows){
    const s = SP[e.i];
    lines.push([qq(s.es), qq(s.eu), qq(s.sci), qq(subName(e.i)), e.n, e.live, e.free, e.lost].join(","));
  }
  const blob = new Blob(["﻿" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `fauna-bizkaia-${es ? "especies" : "espezieak"}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ===========================================================================
   SEI ANIMALIAK — biraketa aurre-errendatua
   36 fotograma espezieko, Blenderren Cycles-/EEVEE-rekin eginak. Ez da WebGL
   bat: irudi-sekuentzia bat da, arrastatuz aurrera eta atzera doana. Hala
   argiztapena eta materialak errendatze-kalitatekoak dira, eta orriak ez du
   kanpo-liburutegirik behar.
=========================================================================== */
const FRAMES = 36;
/* Modeloa eta erregistroko espeziea ez dira beti berdinak. Hontza eta usoa
   bai; dortokarena ez: `Mauremys leprosa`-ren eskanerik ez dago inon, eta
   `Emys orbicularis` erakusten dugu — Iberiako beste ur-dortoka bertakoa,
   putzu beretan bizi dena eta itxura berekoa. Hori esan egin behar da, ez
   ezkutatu: `shows` eremuak zer ikusten den dio, `sp`-k zer zen. */
const MODELS = {
  "Bubo bubo":      {key:"hontza",  shows:"Bubo bubo"},
  "Columba libia":  {key:"usoa",    shows:"Columba livia"},
  "Mauremys leprosa":{key:"dortoka", shows:"Emys orbicularis"}
};
const SIXDATA = SIX.map(i => {
  const sp = SP[R_sp[i]], m = MODELS[sp.sci] || null;
  return {i, sp, date: DATES[i],
    from: R_mun[i] >= 0 ? MUNS[R_mun[i]] : null,
    to:   R_rel[i] >= 0 ? MUNS[R_rel[i]] : null,
    model: m ? m.key : null,
    shows: m ? m.shows : null,
    swapped: !!m && m.shows !== sp.sci};
});

const cache = {};                 // espeziea -> Image[]
let sixIx = 0, frame = 0, spin = null, touched = false;
const vcv = $("#viewCv"), vctx = vcv.getContext("2d");

function loadModel(key){
  if (cache[key]) return cache[key];
  const imgs = [];
  for (let f = 0; f < FRAMES; f++){
    const im = new Image();
    im.decoding = "async";
    im.src = `img/${key}/${String(f).padStart(2,"0")}.webp`;
    im.onload = () => { if (MODELS[SIXDATA[sixIx].sp.sci] === key) drawFrame(); };
    imgs.push(im);
  }
  cache[key] = imgs;
  return imgs;
}

function sizeViewer(){
  const r = vcv.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  vcv.width = Math.round(r.width * dpr); vcv.height = Math.round(r.height * dpr);
  vctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawFrame();
}

function drawFrame(){
  const a = SIXDATA[sixIx];
  if (!a || !a.model) return;
  const imgs = cache[a.model];
  if (!imgs) return;
  const im = imgs[((frame % FRAMES) + FRAMES) % FRAMES];
  const W = vcv.width / (vcv.width / vcv.getBoundingClientRect().width || 1);
  const r = vcv.getBoundingClientRect();
  vctx.clearRect(0, 0, r.width, r.height);
  if (!im || !im.complete || !im.naturalWidth) return;
  /* Irudia osorik sartu, proportzioa galdu gabe. */
  const s = Math.min(r.width / im.naturalWidth, r.height / im.naturalHeight) * 0.94;
  const w = im.naturalWidth * s, h = im.naturalHeight * s;
  vctx.drawImage(im, (r.width - w) / 2, (r.height - h) / 2, w, h);
}

function selectAnimal(ix){
  sixIx = ((ix % SIXDATA.length) + SIXDATA.length) % SIXDATA.length;
  const a = SIXDATA[sixIx];
  if (a.model) loadModel(a.model);
  frame = 0;
  paintSixList(); paintRecord(); drawFrame();
  const t = T[lang];
  $("#viewer").setAttribute("aria-label", t.ariaViewer.replace("{s}", spName(a.sp, lang)));
}

function paintSixList(){
  const t = T[lang];
  $("#sixList").innerHTML = SIXDATA.map((a, k) =>
    `<li><button type="button" data-six="${k}" aria-current="${k === sixIx}">` +
    `<span class="ix">${k + 1}</span>` +
    (a.model ? `<img src="img/${a.model}/00.webp" alt="" loading="lazy">` : "") +
    `<span><span class="nm">${esc(spName(a.sp, lang))}</span>` +
    `<span class="yr">${a.date.slice(0,4)} · ${esc((a.from||"").split("/")[0])}</span></span>` +
    `</button></li>`).join("");
}

function paintRecord(){
  const t = T[lang], a = SIXDATA[sixIx];
  const place = v => v ? esc(v.split("/")[0]) : "—";
  const same = a.from && a.to && a.from === a.to;
  $("#sixRec").innerHTML =
    `<h3>${esc(spName(a.sp, lang))}</h3><span class="sci">${esc(a.sp.sci)}</span>` +
    `<dl>` +
    `<div><dt>${t.recDate}</dt><dd>${a.date}</dd></div>` +
    `<div><dt>${t.recFrom}</dt><dd>${place(a.from)}</dd></div>` +
    `<div><dt>${t.recTo}</dt><dd><b>${place(a.to)}</b>` +
      (same ? `<br><span class="back">${t.recSame}</span>` : "") + `</dd></div>` +
    `<div><dt>${t.recWhy}</dt><dd>${t.recWhyVal}</dd></div>` +
    `<div><dt>${t.recEnd}</dt><dd class="back">${t.recEndVal}</dd></div>` +
    `</dl>`;
  /* Oinoharrak zer ikusten den dio, ez zer zen: biak bat ez datozenean,
     esplizitu. */
  $("#viewCap").innerHTML = a.swapped
    ? `<span class="swap">${t.capShows.replace("{s}", `<i>${esc(a.shows)}</i>`)}</span>`
    : `<span class="sci">${esc(a.shows || a.sp.sci)}</span> · 360°`;
}

function stopSpin(){ if (spin){ cancelAnimationFrame(spin); spin = null; } }
function idleSpin(){
  if (REDUCED || touched) return;
  let last = performance.now(), acc = 0;
  (function step(ts){
    acc += (ts - last) / 1000; last = ts;
    if (acc > 0.16){ acc = 0; frame = (frame + 1) % FRAMES; drawFrame(); }
    spin = touched ? null : requestAnimationFrame(step);
  })(last);
}

function wireViewer(){
  const v = $("#viewer");
  let dragging = false, lastX = 0, moved = 0;
  const mark = () => {
    if (touched) return;
    touched = true; stopSpin();
    $("#viewHint").classList.add("gone");
  };
  v.addEventListener("pointerdown", e => {
    dragging = true; lastX = e.clientX; moved = 0;
    v.setPointerCapture(e.pointerId); mark();
  });
  v.addEventListener("pointermove", e => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    moved += Math.abs(dx);
    /* Oihalaren zabalera osoa = bira oso bat. */
    const per = v.getBoundingClientRect().width / FRAMES;
    if (Math.abs(dx) >= per){
      frame = (frame + Math.round(dx / per) + FRAMES * 4) % FRAMES;
      lastX = e.clientX; drawFrame();
    }
  });
  const end = () => { dragging = false; };
  v.addEventListener("pointerup", end);
  v.addEventListener("pointercancel", end);
  v.addEventListener("keydown", e => {
    if (e.key === "ArrowRight"){ mark(); frame = (frame + 1) % FRAMES; drawFrame(); }
    else if (e.key === "ArrowLeft"){ mark(); frame = (frame + FRAMES - 1) % FRAMES; drawFrame(); }
    else if (e.key === "ArrowDown"){ mark(); selectAnimal(sixIx + 1); }
    else if (e.key === "ArrowUp"){ mark(); selectAnimal(sixIx - 1); }
    else return;
    e.preventDefault();
  });
  $("#spinL").addEventListener("click", () => { mark(); frame = (frame + FRAMES - 3) % FRAMES; drawFrame(); });
  $("#spinR").addEventListener("click", () => { mark(); frame = (frame + 3) % FRAMES; drawFrame(); });
  $("#sixList").addEventListener("click", e => {
    const b = e.target.closest("[data-six]");
    if (b){ mark(); selectAnimal(+b.dataset.six); }
  });
  if (window.ResizeObserver) new ResizeObserver(sizeViewer).observe(v);
}

/* ===========================================================================
   Testu finkoa
=========================================================================== */
function paintStatic(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.titleTag;
  document.querySelectorAll("[data-i18n-aria]").forEach(el =>
    el.setAttribute("aria-label", t[el.dataset.i18nAria]));
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = t[el.dataset.i18n];
    if (typeof v === "string") el.innerHTML = v;
  });
  document.querySelectorAll("[data-lang]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("#prose").innerHTML = t.prose.map(p => `<p>${p}</p>`).join("");
  $("#endBody").innerHTML = t.endBody.map(p => `<p>${p}</p>`).join("");
  $("#method").innerHTML = t.method.map(m => `<div><h4>${m.h}</h4>${m.b}</div>`).join("");
  $("#q").placeholder = t.qPlaceholder;
  document.querySelectorAll("[data-filt]").forEach(b => {
    const k = b.dataset.filt;
    b.querySelector("span").textContent = t["f" + k[0].toUpperCase() + k.slice(1)];
  });
  $("#csv").querySelector("span").textContent = t.csv;
  paintSixList(); paintRecord();
  $("#share").querySelector("span").textContent = t.share;
  $("#qclear").setAttribute("aria-label", t.qClear);
}

/* ===========================================================================
   Egoera eta URLa
=========================================================================== */
const STORE = "fauna.lang";
let urlTimer = null;
function stateHash(){
  const h = new URLSearchParams();
  h.set("lang", lang);
  if (filt !== "all") h.set("show", filt);
  if (q.trim()) h.set("q", q.trim());
  return "#" + h.toString();
}
function writeUrl(){
  clearTimeout(urlTimer);
  urlTimer = setTimeout(() => history.replaceState(null, "", stateHash()), 260);
}
function readUrl(){
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  const l = h.get("lang"); if (l === "eu" || l === "es") lang = l;
  const f = h.get("show"); if (["bird","mam","rep"].includes(f)) filt = f;
  const qq = h.get("q"); if (qq) q = qq;
}
function initLang(){
  let stored = null;
  try { stored = localStorage.getItem(STORE); } catch (e) {}
  if (stored === "eu" || stored === "es") lang = stored;
  else if ((navigator.language || "").toLowerCase().startsWith("es")) lang = "es";
  readUrl();
}
function setLang(l){
  if (l === lang) return;
  lang = l;
  try { localStorage.setItem(STORE, l); } catch (e) {}
  renderAll(); buildSteps(); updateHud(); paintWall(); writeUrl();
}

function wire(){
  document.querySelectorAll("[data-lang]").forEach(b =>
    b.addEventListener("click", () => setLang(b.dataset.lang)));
  document.querySelectorAll("[data-filt]").forEach(b => b.addEventListener("click", () => {
    filt = b.dataset.filt; paintTable(); writeUrl();
  }));
  let deb = null;
  $("#q").addEventListener("input", e => {
    clearTimeout(deb);
    const v = e.target.value;
    deb = setTimeout(() => { q = v; paintTable(); writeUrl(); }, 140);
  });
  $("#qclear").addEventListener("click", () => { $("#q").value=""; q=""; paintTable(); writeUrl(); $("#q").focus(); });
  $("#spTable thead").addEventListener("click", e => {
    const b = e.target.closest("[data-sort]");
    if (!b) return;
    const k = b.dataset.sort;
    if (k === sortKey) sortDir = -sortDir;
    else { sortKey = k; sortDir = (k === "sp" || k === "cls") ? 1 : -1; }
    paintTable();
  });
  $("#csv").addEventListener("click", downloadCsv);
  $("#pulsebox").addEventListener("keydown", e => {
    let m = pulseM;
    if (e.key === "ArrowRight") m = m < 0 ? 0 : Math.min(11, m + 1);
    else if (e.key === "ArrowLeft") m = m < 0 ? 11 : Math.max(0, m - 1);
    else if (e.key === "Escape"){ hidePulseTip(); return; }
    else return;
    e.preventDefault(); showMonth(m);
  });
  $("#pulsebox").addEventListener("blur", hidePulseTip);

  $("#share").addEventListener("click", async () => {
    const btn = $("#share"), label = btn.querySelector("span"), was = label.textContent;
    const url = location.origin + location.pathname + location.search + stateHash();
    try { await navigator.clipboard.writeText(url); } catch (e) { return; }
    label.textContent = T[lang].shared; btn.classList.add("ok");
    setTimeout(() => { label.textContent = was; btn.classList.remove("ok"); }, 1800);
  });

  window.addEventListener("hashchange", () => {
    const before = [lang, filt, q].join("|");
    readUrl();
    if ([lang, filt, q].join("|") === before) return;
    $("#q").value = q; renderAll(); buildSteps(); updateHud();
  });

  let rz = null;
  const remeasure = () => {
    clearTimeout(rz);
    rz = setTimeout(() => { sizeStage(); prepHero(); paintHero(1); drawPulse(); }, 160);
  };
  window.addEventListener("resize", remeasure);
  window.addEventListener("orientationchange", remeasure);
  if (window.ResizeObserver) new ResizeObserver(remeasure).observe($(".stage-gfx"));
}

function renderAll(){
  paintStatic();
  paintLadder();
  drawPulse();
  paintTable();
}

initLang();
wire();
$("#q").value = q;
renderAll();
buildSteps();
sizeStage();
setStep(0, true);
runHero();
wireViewer();
selectAnimal(0);
sizeViewer();
idleSpin();

/* Letra-tipoak kargatu arte canvas-eko etiketak ordezko batekin marrazten
   dira: kargatzean berriro marraztu, bestela neurriak ez datoz bat. */
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => { paintWall(); drawPulse(); });
}

})();
</script>
