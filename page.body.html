    <p><b>Zer iristen den.</b> Bizkaiko basa-faunaren errekuperazio-zentrora 7.649 animalia iritsi dira bost urtean (2021–2025), 294 espezietakoak. Ia erdiak — 3.605 — hilda iristen dira. Bizirik iristen direnetatik, 1.800 askatu dira naturara eta 1.933 hil dira edo sakrifikatu dituzte. Zergatik iritsi zen erabakitzen du zer gertatuko zaion: habiatik erorritako txita batek %61,6ko aukera du itzultzeko; autoak harrapatutako batek %28,8; jabeak entregatutako animalia batek %1,9.</p>
    <p><b>Qué llega.</b> Al centro de recuperación de fauna silvestre de Bizkaia han llegado 7.649 animales en cinco años (2021–2025), de 294 especies. Casi la mitad —3.605— llegan muertos. De los que llegan vivos, 1.800 han sido liberados y 1.933 han muerto o han sido sacrificados. El motivo de la llegada decide el desenlace: un pollo caído del nido tiene un 61,6 % de volver; un animal atropellado, un 28,8 %; uno entregado por su dueño, un 1,9 %.</p>
    <p>Iturria / Fuente: <a href="https://www.opendatabizkaia.eus/es/catalogo/centro-recuperacion-fauna">Open Data Bizkaia · centro-recuperacion-fauna</a>. Grafikoek eta bilatzaileak JavaScript behar dute. · Los gráficos y el buscador necesitan JavaScript.</p>
