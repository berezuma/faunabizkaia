const RAW = JSON.parse(document.getElementById("fn-data").textContent);
const SP = RAW.species, CAUSES = RAW.causes, OUTS = RAW.outs, MUNS = RAW.muns;

const N = RAW.rows.length;

const R_sp  = new Int16Array(N);
const R_cau = new Int16Array(N);

const R_liv = new Uint8Array(N);     // bizirik iritsi da?
const R_mun = new Int16Array(N), R_rel = new Int16Array(N);
const DATES = new Array(N);

let M0 = null;
RAW.rows.forEach(r => { const m = r[0].slice(0, 7); if (M0 === null || m < M0) M0 = m; });
const monIx = s => { const y = +s.slice(0,4), m = +s.slice(5,7);
  return (y - +M0.slice(0,4)) * 12 + (m - +M0.slice(5,7)); };

RAW.rows.forEach((r, i) => {
  DATES[i] = r[0];
  R_mon[i] = monIx(r[0]);
  R_sp[i] = r[2]; R_cau[i] = r[3]; R_liv[i] = r[4]; R_out[i] = r[5];
  R_mun[i] = r[6]; R_rel[i] = r[7];
});
const NM = Math.max(...R_mon) + 1;                       // hilabete kopurua
const YEARS = [...new Set(RAW.rows.map(r => +r[0].slice(0,4)))].sort();

/* --- laburpenak ---------------------------------------------------------- */
const liveN = [...R_liv].reduce((a,b) => a+b, 0);
const deadIn = N - liveN;
const isFree = i => OG[R_out[i]] === "free";
const isLost = i => OG[R_out[i]] === "dead" || OG[R_out[i]] === "put";
const known  = i => R_liv[i] && OG[R_out[i]] !== "unk";
const freeN = RAW.rows.reduce((a,_,i) => a + (isFree(i) ? 1 : 0), 0);
const knownN = RAW.rows.reduce((a,_,i) => a + (known(i) ? 1 : 0), 0);
const lostN = RAW.rows.reduce((a,_,i) => a + (known(i) && isLost(i) ? 1 : 0), 0);

/* Hilabeteko zenbaketak, eszenarako. */
const monAll = new Int32Array(NM), monLive = new Int32Array(NM), monDead = new Int32Array(NM);
for (let i = 0; i < N; i++){
  monAll[R_mon[i]]++;
  (R_liv[i] ? monLive : monDead)[R_mon[i]]++;
}

/* Bizirauteko eskailera: zergatik iritsi zen, eta zenbatek atera zuten.
   Bizirik iritsitakoak bakarrik: hilda iristen denak ez du aukerarik. */
const LADDER = (() => {
  const g = new Map();
  for (let i = 0; i < N; i++){
    if (!known(i)) continue;
    const k = R_cau[i];
    const e = g.get(k) || {k, n: 0, free: 0};
    e.n++; if (isFree(i)) e.free++;
    g.set(k, e);
  }
  /* Arrazoirik gabeko erregistroak kanpoan: hutsune bat ez da arrazoi bat,
     eta eskailerako lehen maila izango litzateke, esanahirik gabe. */
  return [...g.values()]
    .filter(e => e.n >= 25 && CAUSES[e.k] && CAUSES[e.k] !== "—")
    .sort((a, b) => b.free / b.n - a.free / a.n);
})();

/* Espezie bakoitzaren fitxa: zenbat iritsi, zenbat bizirik, zenbat askatu. */
const BYSP = (() => {
  const a = SP.map((s, i) => ({i, n: 0, live: 0, free: 0, lost: 0}));
  for (let i = 0; i < N; i++){
    const e = a[R_sp[i]];
    e.n++; if (R_liv[i]) e.live++;
    if (isFree(i)) e.free++; else if (known(i) && isLost(i)) e.lost++;
  }
  return a.filter(e => e.n > 0).sort((x, y) => y.n - x.n);
})();

/* Sei animaliak: jabeak emanda iritsi eta hala ere askatu zirenak. */
const HANDED = CAUSES.findIndex(c => /^cedido por particular/i.test(c));
const SIX = [];
for (let i = 0; i < N; i++) if (R_cau[i] === HANDED && isFree(i)) SIX.push(i);
const HANDED_N = RAW.rows.reduce((a,_,i) => a + (R_cau[i] === HANDED ? 1 : 0), 0);
const HANDED_LIVE = RAW.rows.reduce((a,_,i) => a + (R_cau[i] === HANDED && R_liv[i] ? 1 : 0), 0);

let lang = "eu", filt = "all", q = "", sortKey = "n", sortDir = -1;

const $ = s => document.querySelector(s);
const NUMLOC = "es-ES";
const nf0 = new Intl.NumberFormat(NUMLOC, {maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat(NUMLOC, {minimumFractionDigits:1, maximumFractionDigits:1});
/* Lau zifrako zenbakiak gaztelaniaz puntu gabe idazten dira arauz (7649),
   baina orri honetako testuak 7.649 darabil. Koherentzia nagusitzen da:
   leku guztietan berdin. */
const nfg = new Intl.NumberFormat(NUMLOC, {useGrouping:true, maximumFractionDigits:0});
const num = v => nfg.format(Math.round(v)).replace(/\u00a0/g, ".");
const pc = v => nf1.format(v) + " %";
const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Espeziearen izena erakusteko: euskaraz lehenik, eta hori ez badago,
   gaztelaniaz. 42 espeziek ez dute euskarazko izenik iturrian. */

/* Iturriak sartzeko arrazoiak gaztelaniaz bakarrik dakartza. Orria elebiduna
   denez, hemen itzultzen dira; itzulpenik ez dagoenean, iturrikoa bera. */

  "Cría":"Txita, habiatik erorita", "Traumatismo":"Traumatismoa",
  "Control poblacional":"Populazio-kontrola", "Captura":"Harrapaketa",

  "Desconocido":"Ezezaguna", "Ataque de otro animal":"Beste animalia baten erasoa",
  "Barreras artificiales":"Hesi artifizialak", "Enfermedad":"Gaixotasuna",
  "Descaste ó eliminación de la especie":"Espeziea ezabatzea", "Temporal":"Ekaitza",
  "Disparo":"Tiroa", "Electrocución":"Elektrokuzioa", "Decomisado":"Konfiskatua",
  "Intoxicación":"Intoxikazioa", "Artes de pesca":"Arrantza-tresnak",
  "Control Epidemiológico":"Kontrol epidemiologikoa", "Trampas":"Tranpak",
  "Petroleado":"Petrolioz zikindua",
  "Colisión línea eléctrica o aerogenerador":"Linea elektrikoa edo aerosorgailua",

  "Inanición":"Goseteak", "Ahogamiento":"Itotzea", "Anzuelo":"Amua"
};
const causeName = (c, l) => (l === "eu" && CAUSE_EU[c]) ? CAUSE_EU[c] : c;
const clsOf = i => { const c = RAW.spClass[i]; return c >= 0 ? CLASSES[c] : ""; };
const CLS_BIRD = "AVES", CLS_MAM = "MAMIFEROS", CLS_REP = "REPTILES";

/* ===========================================================================
   PUNTU-MOTORRA — eszena
   Animalia bakoitza laukizuzen bat da; ez dira inoiz berriro sortzen, dauden
   lekutik mugitzen dira. Jarraitutasuna bera da argudioa.
=========================================================================== */
const fromX = new Float32Array(N), fromY = new Float32Array(N),
      fromW = new Float32Array(N), fromH = new Float32Array(N);
const toX = new Float32Array(N), toY = new Float32Array(N),
      toW = new Float32Array(N), toH = new Float32Array(N);
const grp = new Uint8Array(N);          // 0 arrunta · 1 azpimarratua · 2 galduak
const gIdx = [new Int32Array(N), new Int32Array(N), new Int32Array(N)];
const gLen = [0, 0, 0];
function regroup(){
  gLen[0] = gLen[1] = gLen[2] = 0;
  for (let i = 0; i < N; i++){ const g = grp[i]; gIdx[g][gLen[g]++] = i; }
}

/* Eszenaren urratsak. `split`: marrak zer esan nahi duen urrats horretan. */
const SCENE = [
  {split:"none",  mark:"none"},
  {split:"state", mark:"none"},
  {split:"state", mark:"young"},
  {split:"state", mark:"remove"},
  {split:"fate",  mark:"none"}
];

const wallCv = $("#wallCanvas"), wallCtx = wallCv.getContext("2d");
const heroCv = $("#heroCanvas"), heroCtx = heroCv.getContext("2d");

let stepIx = 0, tween = 1, rafId = null, lastTs = 0, plot = null, sizing = false;

function measure(cv, ctx, opts){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = r.width, H = r.height;
  const pl = W * (opts.pl ?? .05), pr = W * (opts.pr ?? .05);
  return {W, H, pl, pr, iw: W - pl - pr, lineY: H * (opts.line ?? .46)};
}

/* Animalia bakoitzari bere laukizuzena. Hilabeteko zutabe bat, eta zutabe
   barruan pilatuta: gora bizirik iritsiak, behera hildakoak. */
function buildTarget(cfg, P){
  const colW = P.iw / NM;
  const w = Math.max(1.1, colW - 1.4);
  /* Laukizuzenaren altuera pilarik altuenak kabitzeko kalkulatzen da, ez
     zenbaki finko batekin: bestela udako gailurrak oihaletik ateratzen ziren. */
  const topRoom = P.lineY - P.H * 0.10;
  const botRoom = P.H - P.lineY - P.H * 0.10;
  const hi = Math.max(1, Math.max(...monLive)), lo = Math.max(1, Math.max(...monDead));
  const all = Math.max(1, Math.max(...monAll));
  /* `unit` = animalia bakoitzak hartzen duen lekua, tartea barne. Pilarik
     altuenak kabitu behar du, eta hortik ateratzen da altuera — ez
     alderantziz. Hala ez dago zutaberik oihaletik ateratzen denik. */
  const unit = Math.min(
    cfg.split === "none" ? topRoom / all : topRoom / hi,
    cfg.split === "none" ? 4.0 : botRoom / lo, 4.0);
  const h = Math.max(0.6, unit * 0.68), gap = unit - h;
  const up = new Float32Array(NM), down = new Float32Array(NM);

  for (let i = 0; i < N; i++){
    const m = R_mon[i];
    const x = P.pl + m * colW + (colW - w) / 2;
    let above;
    if (cfg.split === "none") above = true;
    else if (cfg.split === "state") above = !!R_liv[i];
    else above = isFree(i);                       // "fate": askatuak bakarrik gainean
    toX[i] = x; toW[i] = w; toH[i] = h;
    if (above){ up[m] += h + gap; toY[i] = P.lineY - up[m]; }
    else { toY[i] = P.lineY + down[m]; down[m] += h + gap; }

    grp[i] = cfg.mark === "young" ? (CG[R_cau[i]] === "young" ? 1 : 0)
           : cfg.mark === "remove" ? (CG[R_cau[i]] === "remove" ? 1 : 0)
           : cfg.split === "fate" ? (isFree(i) ? 1 : 2)
           : cfg.split === "state" ? (R_liv[i] ? 0 : 2)
           : 0;
  }
}

const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
/* Kolore-sistemak bi kolore ditu: hezurra (animalia bat) eta oxidoa (ez zen
   bizirik atera). Azpimarratzeko ez da hirugarren kolore bat sartzen —
   gainerakoa ilundu egiten da. Hala sistemak bere esanahia gordetzen du. */
const COL = ["rgba(140,160,143,.55)", "#efe9dc", "#c0552f"];
const COL_DIM = ["rgba(140,160,143,.13)", "#efe9dc", "rgba(192,85,47,.16)"];

function ensurePlot(){
  if (sizing || !plot) return;
  const r = wallCv.getBoundingClientRect();
  if (Math.abs(r.width - plot.W) > .5 || Math.abs(r.height - plot.H) > .5) sizeStage();
}

function paintWall(){
  ensurePlot();
  const P = plot, t = ease(tween), T_ = T[lang];
  const ctx = wallCtx;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, wallCv.width, wallCv.height); ctx.restore();

  const cfg = SCENE[stepIx];
  const pal = cfg.mark === "none" ? COL : COL_DIM;
  for (let g = 0; g < 3; g++){
    const idx = gIdx[g], n = gLen[g];
    if (!n) continue;
    ctx.fillStyle = pal[g];
    ctx.beginPath();
    for (let k = 0; k < n; k++){
      const i = idx[k];
      ctx.rect(fromX[i] + (toX[i]-fromX[i])*t, fromY[i] + (toY[i]-fromY[i])*t,
               fromW[i] + (toW[i]-fromW[i])*t, fromH[i] + (toH[i]-fromH[i])*t);
    }
    ctx.fill();
  }

  /* MARRA. Lehen urratsean ez dago: oraindik ez du ezer esan nahi. */
  if (cfg.split !== "none"){
    const a = Math.min(1, t * 1.6);
    ctx.save(); ctx.globalAlpha = a;
    ctx.strokeStyle = "#efe9dc"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(P.pl * .4, P.lineY); ctx.lineTo(P.W - P.pr * .4, P.lineY); ctx.stroke();
    ctx.restore();
  }

  /* Urte-markak, azpian. */
  ctx.fillStyle = "rgba(140,160,143,.8)";
  ctx.font = `500 ${Math.max(11, P.W*.0095)}px ${READ}`;
  ctx.textAlign = "center";
  const colW = P.iw / NM;
  YEARS.forEach(y => {
    const m0 = (y - YEARS[0]) * 12;
    ctx.fillText(y, P.pl + (m0 + 6) * colW, P.H - 16);
  });
}

function setStep(ix, instant){
  ix = Math.max(0, Math.min(SCENE.length - 1, ix));
  const t = ease(tween);
  for (let i = 0; i < N; i++){
    fromX[i] += (toX[i]-fromX[i])*t; fromY[i] += (toY[i]-fromY[i])*t;
    fromW[i] += (toW[i]-fromW[i])*t; fromH[i] += (toH[i]-fromH[i])*t;
  }
  stepIx = ix;
  buildTarget(SCENE[ix], plot);
  regroup();
  tween = (instant || REDUCED) ? 1 : 0;
  updateHud();
  if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
  lastTs = 0;
  if (tween < 1) rafId = requestAnimationFrame(loop); else paintWall();
}

function loop(ts){
  const now = ts || performance.now();
  if (!lastTs) lastTs = now;
  tween = Math.min(1, tween + (now - lastTs) / 900);
  lastTs = now;
  paintWall();
  rafId = tween < 1 ? requestAnimationFrame(loop) : null;
}

function updateHud(){
  const t = T[lang];
  $("#hudYear").textContent = YEARS[0] + "–" + YEARS[YEARS.length-1];
  $("#hudN").textContent = num(N);
  $("#hudAlive").textContent = num(liveN);
  $("#hudFree").textContent = num(freeN);
  wallCv.setAttribute("aria-label",
    `${t.stageTitle} — ${num(N)} ${t.rN}, ${num(liveN)} ${t.rAlive}, ${num(freeN)} ${t.rFree}`);
}

function stagePads(){
  if (window.innerWidth >= 821) return {pr:.34, line:.46};
  let card = 0;
  document.querySelectorAll(".step > div").forEach(el => card = Math.max(card, el.offsetHeight));
  const h = wallCv.getBoundingClientRect().height || window.innerHeight || 800;
  return {pl:.04, pr:.04, line: Math.max(.22, Math.min(.42, (h - card - h*.09) / h * .62))};
}

function sizeStage(){
  sizing = true;
  plot = measure(wallCv, wallCtx, stagePads());
  buildTarget(SCENE[stepIx], plot);
  regroup();
  fromX.set(toX); fromY.set(toY); fromW.set(toW); fromH.set(toH);
  tween = 1; sizing = false;
  paintWall();
}

/* --- goiburuko horma: eszena bera, isilago, testuaren atzean ------------- */
let heroPrep = null;
function prepHero(){
  const P = measure(heroCv, heroCtx, {pl:.03, pr:.03, line: parseFloat(cssv("--line-y")) / 100});
  heroPrep = {P};
}
function paintHero(prog){
  if (!heroPrep) prepHero();
  const {P} = heroPrep;
  const colW = P.iw / NM, w = Math.max(1.1, colW - 1.4);
  heroCtx.clearRect(0, 0, P.W, P.H);
  const up = new Float32Array(NM), down = new Float32Array(NM);
  const h = Math.max(1, Math.min(2.4, (P.H * .22) / Math.max(...monAll) * 2));
  for (let g = 0; g < 2; g++){
    /* Goiburuan hormak ehundura bat izan behar du, ez protagonista:
       testuak irakurgarri geratu behar du gainean. */
    heroCtx.fillStyle = g ? "rgba(192,85,47,.34)" : "rgba(239,233,220,.20)";
    heroCtx.beginPath();
    for (let i = 0; i < N; i++){
      const live = !!R_liv[i];
      if ((g === 0) !== live) continue;
      const m = R_mon[i], x = P.pl + m * colW + (colW - w) / 2;
      let y;
      if (live){ up[m] += (h + .5) * prog; y = P.lineY - up[m]; }
      else { y = P.lineY + down[m]; down[m] += (h + .5) * prog; }
      heroCtx.rect(x, y, w, h);
    }
    heroCtx.fill();
  }
}
function runHero(){
  prepHero();
  if (REDUCED){ paintHero(1); return; }
  const t0 = performance.now();
  (function frame(ts){
    const p = Math.min(1, (ts - t0) / 1700);
    paintHero(ease(p));
    if (p < 1) requestAnimationFrame(frame);
  })(t0);
}

const READ = '"Source Serif 4", Georgia, serif';

/* --- urratsen testua eta scroll-behatzailea ------------------------------ */
function buildSteps(){
  const n = T[lang].steps.length;
  $("#steps").innerHTML = T[lang].steps.map((s, i) =>
    `<div class="step" data-ix="${i}"><div>` +
    `<p class="stepno">${i + 1}/${n}</p><h3>${s.h}</h3><p>${s.p}</p></div></div>`).join("");
  observeSteps();
}
let stepObs = null;
function observeSteps(){
  if (stepObs) stepObs.disconnect();
  stepObs = new IntersectionObserver(entries => {
    for (const e of entries){
      e.target.classList.toggle("on", e.isIntersecting);
      if (!e.isIntersecting) continue;
      const ix = +e.target.dataset.ix;
      if (ix !== stepIx) setStep(ix);
    }
  }, {rootMargin: "-45% 0px -45% 0px", threshold: 0});
  document.querySelectorAll(".step").forEach(el => stepObs.observe(el));
}

/* ===========================================================================
   Bizirauteko eskailera
=========================================================================== */
function paintLadder(){
  const t = T[lang];
  const max = Math.max(...LADDER.map(e => e.free / e.n));
  $("#ladder").innerHTML = LADDER.map((e, k) => {
    const p = e.free / e.n * 100;
    const cl = k === 0 ? " best" : (p < 10 ? " worst" : "");
    return `<div class="lrow${cl}">` +
      `<span class="why">${esc(causeName(CAUSES[e.k], lang))}</span>` +
      `<span class="track"><i style="width:${(p / (max*100) * 100).toFixed(1)}%"></i></span>` +
      `<span class="pc">${pc(p)}</span>` +
      `<span class="n">${num(e.free)} / ${num(e.n)}</span></div>`;
  }).join("");
}

/* ===========================================================================
   Urteko pultsua — hilabeteak, bost urte bata bestearen gainean
=========================================================================== */
const PW = 1000;
let PH = 340, PPL = 56, PPR = 20, PPT = 24, PPB = 46, PIW = 924, PIH = 270, PK = 1;
const psc = n => Math.round(n * PK * 10) / 10;

function pulseGeom(){
  const w = $("#pulse").getBoundingClientRect().width || PW;
  PK = Math.min(3, Math.max(1, 1000 / w));
  PH = Math.round(340 + (PK - 1) * 180);
  PPL = Math.round(22 + 34 * PK); PPT = Math.round(10 + 14 * PK); PPB = Math.round(16 + 30 * PK);
  PIW = PW - PPL - PPR; PIH = PH - PPT - PPB;
  $("#pulse").setAttribute("viewBox", `0 0 ${PW} ${PH}`);
}

const MONTH = (() => {
  const all = new Int32Array(12), young = new Int32Array(12), rem = new Int32Array(12);
  for (let i = 0; i < N; i++){
    const m = +DATES[i].slice(5,7) - 1;
    all[m]++;
    if (CG[R_cau[i]] === "young") young[m]++;
    if (CG[R_cau[i]] === "remove") rem[m]++;
  }
  return {all, young, rem};
})();

function drawPulse(){
  pulseGeom();
  const t = T[lang];
  const max = Math.max(...MONTH.all) * 1.08;
  const X = m => PPL + (m + .5) / 12 * PIW;
  const Y = v => PPT + PIH - v / max * PIH;
  const bw = PIW / 12 * .62;
  const grid = cssv("--rule"), muted = cssv("--muted"), ink = cssv("--ink");
  const c1 = cssv("--night-3"), c2 = cssv("--oxide-soft");
  let s = "";

  const step = Math.pow(10, Math.floor(Math.log10(max / 4)));
  const st = Math.ceil(max / 4 / step) * step;
  for (let v = 0; v <= max; v += st){
    s += `<line x1="${PPL}" y1="${Y(v).toFixed(1)}" x2="${PW-PPR}" y2="${Y(v).toFixed(1)}" stroke="${grid}" stroke-width="${psc(1)}"/>`;
    s += `<text x="${PPL-psc(10)}" y="${(Y(v)+psc(4)).toFixed(1)}" text-anchor="end" font-size="${psc(12)}" fill="${muted}" font-family='${READ}'>${num(v)}</text>`;
  }
  for (let m = 0; m < 12; m++){
    const x = X(m) - bw/2;
    s += `<rect x="${x.toFixed(1)}" y="${Y(MONTH.all[m]).toFixed(1)}" width="${bw.toFixed(1)}" height="${(PPT+PIH-Y(MONTH.all[m])).toFixed(1)}" fill="${c1}" fill-opacity=".30"/>`;
    s += `<rect x="${x.toFixed(1)}" y="${Y(MONTH.young[m]).toFixed(1)}" width="${(bw*.52).toFixed(1)}" height="${(PPT+PIH-Y(MONTH.young[m])).toFixed(1)}" fill="${c1}"/>`;
    s += `<rect x="${(x+bw*.52).toFixed(1)}" y="${Y(MONTH.rem[m]).toFixed(1)}" width="${(bw*.48).toFixed(1)}" height="${(PPT+PIH-Y(MONTH.rem[m])).toFixed(1)}" fill="${c2}"/>`;
    s += `<text x="${X(m).toFixed(1)}" y="${PH-PPB+psc(20)}" text-anchor="middle" font-size="${psc(12)}" fill="${muted}" font-family='${READ}'>${t.mon[m]}</text>`;
  }
  s += `<line x1="${PPL}" y1="${PPT+PIH}" x2="${PW-PPR}" y2="${PPT+PIH}" stroke="${grid}" stroke-width="${psc(1)}"/>`;
  s += `<rect id="pcursor" x="0" y="${PPT}" width="${bw.toFixed(1)}" height="${PIH}" fill="${ink}" fill-opacity=".08" visibility="hidden"/>`;
  s += `<rect id="phit" x="${PPL}" y="${PPT}" width="${PIW}" height="${PIH}" fill="transparent" style="cursor:crosshair"/>`;

  const svg = $("#pulse");
  svg.innerHTML = s;
  svg.setAttribute("aria-hidden", "true");
  $("#pulsebox").setAttribute("aria-label", t.yearTitle);
  const hit = svg.querySelector("#phit");
  hit.addEventListener("pointermove", pulseMove);
  hit.addEventListener("pointerdown", pulseMove);
  hit.addEventListener("pointerleave", hidePulseTip);

  $("#pulseLegend").innerHTML =
    `<span><i style="background:${c1};opacity:.3"></i>${t.legAll}</span>` +
    `<span><i style="background:${c1}"></i>${t.legYoung}</span>` +
    `<span><i style="background:${c2}"></i>${t.legRemove}</span>`;
}

let pulseM = -1;
function hidePulseTip(){ pulseM = -1; $("#tipP").classList.remove("on");
  const c = document.getElementById("pcursor"); if (c) c.setAttribute("visibility","hidden"); }
function pulseMove(e){
  const svg = $("#pulse"), r = svg.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * PW;
  showMonth(Math.floor((x - PPL) / PIW * 12));
}
function showMonth(m){
  if (m < 0 || m > 11){ hidePulseTip(); return; }
  pulseM = m;
  const t = T[lang], tip = $("#tipP"), svg = $("#pulse"), r = svg.getBoundingClientRect();
  tip.innerHTML = `<div>${t.tipMon.replace("{m}", t.mon[m]).replace("{n}", num(MONTH.all[m]))}</div>` +
    `<div><em>${num(MONTH.young[m])}</em> ${t.legYoung.toLowerCase()} · ${num(MONTH.rem[m])} ${t.legRemove.toLowerCase()}</div>`;
  tip.classList.add("on");
  const bw = PIW / 12 * .62, X = PPL + (m + .5) / 12 * PIW;
  const cur = document.getElementById("pcursor");
  if (cur){ cur.setAttribute("x", (X - bw/2).toFixed(1)); cur.setAttribute("visibility","visible"); }
  const box = $("#pulsebox").getBoundingClientRect();
  const px = r.left - box.left + X / PW * r.width;
  const tw = tip.offsetWidth;
  tip.style.left = Math.max(4, Math.min(box.width - tw - 4, px - tw/2)) + "px";
  tip.style.top = Math.round(r.height * .12) + "px";
}

const COLL = new Intl.Collator("es", {sensitivity:"base"});
const COLS = [
  {k:"sp",   t:"thSp"},
  {k:"cls",  t:"thCls"},
  {k:"n",    t:"thN",    n:true},
  {k:"live", t:"thLive", n:true},
  {k:"free", t:"thFree", n:true},
  {k:"fate", t:"thFate"}
];
let lastRows = [];

function matchSp(e, needle){
  if (!needle) return true;
  const s = SP[e.i];
  return (s.eu||"").toLowerCase().includes(needle) || (s.es||"").toLowerCase().includes(needle)
      || (s.sci||"").toLowerCase().includes(needle);
}
function passFilt(e){
  const c = clsOf(e.i);
  return filt === "all" || (filt === "bird" && c === CLS_BIRD)
      || (filt === "mam" && c === CLS_MAM) || (filt === "rep" && c === CLS_REP);
}

function paintTable(){
  const t = T[lang], needle = q.trim().toLowerCase();
  let rows = BYSP.filter(e => passFilt(e) && matchSp(e, needle));
  const cmp = {
    sp:  (a,b) => COLL.compare(spName(SP[a.i],lang), spName(SP[b.i],lang)),
    cls: (a,b) => COLL.compare(clsOf(a.i), clsOf(b.i)),
    n:   (a,b) => a.n - b.n,
    live:(a,b) => a.live - b.live,
    free:(a,b) => a.free - b.free,
    fate:(a,b) => (a.free/(a.n||1)) - (b.free/(b.n||1))
  }[sortKey];
  rows = rows.slice().sort((a,b) => sortDir * cmp(a,b) || b.n - a.n);
  lastRows = rows;

  $("#spTable thead").innerHTML = "<tr>" + COLS.map(c => {
    const on = sortKey === c.k, arrow = on ? (sortDir < 0 ? "▾" : "▴") : "";
    return `<th class="${c.n ? "n " : ""}s${on ? " on" : ""}" aria-sort="${on ? (sortDir<0?"descending":"ascending") : "none"}">` +
      `<button type="button" data-sort="${c.k}" aria-label="${esc(t.sortBy.replace("{c}",t[c.t]).replace("{d}", (on&&sortDir>0)?t.sortDesc:t.sortAsc))}">` +
      `${t[c.t]}<span aria-hidden="true">${arrow}</span></button></th>`;
  }).join("") + "</tr>";

  const mx = Math.max(1, ...rows.map(e => e.n));
  $("#spTable tbody").innerHTML = rows.map(e => {
    const s = SP[e.i];
    const f = e.n ? e.free / e.n * 100 : 0, l = e.n ? e.lost / e.n * 100 : 0;
    return `<tr><td>${esc(spName(s, lang))}${s.sci ? `<span class="sci">${esc(s.sci)}</span>` : ""}</td>` +
      `<td>${esc(subName(e.i))}</td>` +
      `<td class="n">${num(e.n)}</td>` +
      `<td class="n">${num(e.live)}</td>` +
      `<td class="n">${num(e.free)}</td>` +
      `<td><span class="bar" aria-hidden="true"><i class="f" style="width:${f.toFixed(1)}%"></i>` +
      `<i class="d" style="width:${l.toFixed(1)}%"></i></span></td></tr>`;
  }).join("") || `<tr><td colspan="6" class="empty">${t.tblEmpty}</td></tr>`;

  const tot = rows.reduce((a,e) => a + e.n, 0);
  $("#qcount").textContent = t.qCount.replace("{n}", num(rows.length)).replace("{m}", num(tot));
  $("#csv").disabled = !rows.length;
  document.querySelectorAll("[data-filt]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.filt === filt)));
  $("#tblLegend").innerHTML =
    `<span><i style="background:${cssv("--night-3")}"></i>${t.legRowFree}</span>` +
    `<span><i style="background:${cssv("--oxide-soft")}"></i>${t.legRowLost}</span>`;
}
const subName = i => { const s = RAW.spSub[i]; return s >= 0 ? SUBS[s] : (clsOf(i) || "—"); };

function downloadCsv(){
  const es = lang === "es";
  const head = es
    ? ["especie_es","especie_eu","nombre_cientifico","grupo","llegados","vivos","liberados","muertos_o_sacrificados"]
    : ["espezie_es","espezie_eu","izen_zientifikoa","taldea","iritsiak","bizirik","askatuak","hil_edo_sakrifikatuak"];
  const qq = v => `"${String(v == null ? "" : v).replace(/"/g,'""')}"`;
  const lines = [head.join(",")];
  for (const e of lastRows){
    const s = SP[e.i];
    lines.push([qq(s.es), qq(s.eu), qq(s.sci), qq(subName(e.i)), e.n, e.live, e.free, e.lost].join(","));
  }
  const blob = new Blob(["﻿" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `fauna-bizkaia-${es ? "especies" : "espezieak"}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ===========================================================================
   SEI ANIMALIAK — biraketa aurre-errendatua
   36 fotograma espezieko, Blenderren Cycles-/EEVEE-rekin eginak. Ez da WebGL
   bat: irudi-sekuentzia bat da, arrastatuz aurrera eta atzera doana. Hala
   argiztapena eta materialak errendatze-kalitatekoak dira, eta orriak ez du
   kanpo-liburutegirik behar.
=========================================================================== */
const FRAMES = 36;
/* Modeloa eta erregistroko espeziea ez dira beti berdinak. Hontza eta usoa
   bai; dortokarena ez: `Mauremys leprosa`-ren eskanerik ez dago inon, eta
   `Emys orbicularis` erakusten dugu — Iberiako beste ur-dortoka bertakoa,
   putzu beretan bizi dena eta itxura berekoa. Hori esan egin behar da, ez
   ezkutatu: `shows` eremuak zer ikusten den dio, `sp`-k zer zen. */
const MODELS = {
  "Bubo bubo":      {key:"hontza",  shows:"Bubo bubo"},
  "Columba libia":  {key:"usoa",    shows:"Columba livia"},
  "Mauremys leprosa":{key:"dortoka", shows:"Emys orbicularis"}
};
const SIXDATA = SIX.map(i => {
  const sp = SP[R_sp[i]], m = MODELS[sp.sci] || null;
  return {i, sp, date: DATES[i],
    from: R_mun[i] >= 0 ? MUNS[R_mun[i]] : null,
    to:   R_rel[i] >= 0 ? MUNS[R_rel[i]] : null,
    model: m ? m.key : null,
    shows: m ? m.shows : null,
    swapped: !!m && m.shows !== sp.sci};
});

const cache = {};                 // espeziea -> Image[]
let sixIx = 0, frame = 0, spin = null, touched = false;
const vcv = $("#viewCv"), vctx = vcv.getContext("2d");

function loadModel(key){
  if (cache[key]) return cache[key];
  const imgs = [];
  for (let f = 0; f < FRAMES; f++){
    const im = new Image();
    im.decoding = "async";
    im.src = `img/${key}/${String(f).padStart(2,"0")}.webp`;
    im.onload = () => { if (MODELS[SIXDATA[sixIx].sp.sci] === key) drawFrame(); };
    imgs.push(im);
  }
  cache[key] = imgs;
  return imgs;
}

function sizeViewer(){
  const r = vcv.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  vcv.width = Math.round(r.width * dpr); vcv.height = Math.round(r.height * dpr);
  vctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawFrame();
}

function drawFrame(){
  const a = SIXDATA[sixIx];
  if (!a || !a.model) return;
  const imgs = cache[a.model];
  if (!imgs) return;
  const im = imgs[((frame % FRAMES) + FRAMES) % FRAMES];
  const W = vcv.width / (vcv.width / vcv.getBoundingClientRect().width || 1);
  const r = vcv.getBoundingClientRect();
  vctx.clearRect(0, 0, r.width, r.height);
  if (!im || !im.complete || !im.naturalWidth) return;
  /* Irudia osorik sartu, proportzioa galdu gabe. */
  const s = Math.min(r.width / im.naturalWidth, r.height / im.naturalHeight) * 0.94;
  const w = im.naturalWidth * s, h = im.naturalHeight * s;
  vctx.drawImage(im, (r.width - w) / 2, (r.height - h) / 2, w, h);
}

function selectAnimal(ix){
  sixIx = ((ix % SIXDATA.length) + SIXDATA.length) % SIXDATA.length;
  const a = SIXDATA[sixIx];
  if (a.model) loadModel(a.model);
  frame = 0;
  paintSixList(); paintRecord(); drawFrame();
  const t = T[lang];
  $("#viewer").setAttribute("aria-label", t.ariaViewer.replace("{s}", spName(a.sp, lang)));
}

function paintSixList(){
  const t = T[lang];
  $("#sixList").innerHTML = SIXDATA.map((a, k) =>
    `<li><button type="button" data-six="${k}" aria-current="${k === sixIx}">` +
    `<span class="ix">${k + 1}</span>` +
    (a.model ? `<img src="img/${a.model}/00.webp" alt="" loading="lazy">` : "") +
    `<span><span class="nm">${esc(spName(a.sp, lang))}</span>` +
    `<span class="yr">${a.date.slice(0,4)} · ${esc((a.from||"").split("/")[0])}</span></span>` +
    `</button></li>`).join("");
}

function paintRecord(){
  const t = T[lang], a = SIXDATA[sixIx];
  const place = v => v ? esc(v.split("/")[0]) : "—";
  const same = a.from && a.to && a.from === a.to;
  $("#sixRec").innerHTML =
    `<h3>${esc(spName(a.sp, lang))}</h3><span class="sci">${esc(a.sp.sci)}</span>` +
    `<dl>` +
    `<div><dt>${t.recDate}</dt><dd>${a.date}</dd></div>` +
    `<div><dt>${t.recFrom}</dt><dd>${place(a.from)}</dd></div>` +
    `<div><dt>${t.recTo}</dt><dd><b>${place(a.to)}</b>` +
      (same ? `<br><span class="back">${t.recSame}</span>` : "") + `</dd></div>` +
    `<div><dt>${t.recWhy}</dt><dd>${t.recWhyVal}</dd></div>` +
    `<div><dt>${t.recEnd}</dt><dd class="back">${t.recEndVal}</dd></div>` +
    `</dl>`;
  /* Oinoharrak zer ikusten den dio, ez zer zen: biak bat ez datozenean,
     esplizitu. */
  $("#viewCap").innerHTML = a.swapped
    ? `<span class="swap">${t.capShows.replace("{s}", `<i>${esc(a.shows)}</i>`)}</span>`
    : `<span class="sci">${esc(a.shows || a.sp.sci)}</span> · 360°`;
}

function stopSpin(){ if (spin){ cancelAnimationFrame(spin); spin = null; } }
function idleSpin(){
  if (REDUCED || touched) return;
  let last = performance.now(), acc = 0;
  (function step(ts){
    acc += (ts - last) / 1000; last = ts;
    if (acc > 0.16){ acc = 0; frame = (frame + 1) % FRAMES; drawFrame(); }
    spin = touched ? null : requestAnimationFrame(step);
  })(last);
}

function wireViewer(){
  const v = $("#viewer");
  let dragging = false, lastX = 0, moved = 0;
  const mark = () => {
    if (touched) return;
    touched = true; stopSpin();
    $("#viewHint").classList.add("gone");
  };
  v.addEventListener("pointerdown", e => {
    dragging = true; lastX = e.clientX; moved = 0;
    v.setPointerCapture(e.pointerId); mark();
  });
  v.addEventListener("pointermove", e => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    moved += Math.abs(dx);
    /* Oihalaren zabalera osoa = bira oso bat. */
    const per = v.getBoundingClientRect().width / FRAMES;
    if (Math.abs(dx) >= per){
      frame = (frame + Math.round(dx / per) + FRAMES * 4) % FRAMES;
      lastX = e.clientX; drawFrame();
    }
  });
  const end = () => { dragging = false; };
  v.addEventListener("pointerup", end);
  v.addEventListener("pointercancel", end);
  v.addEventListener("keydown", e => {
    if (e.key === "ArrowRight"){ mark(); frame = (frame + 1) % FRAMES; drawFrame(); }
    else if (e.key === "ArrowLeft"){ mark(); frame = (frame + FRAMES - 1) % FRAMES; drawFrame(); }
    else if (e.key === "ArrowDown"){ mark(); selectAnimal(sixIx + 1); }
    else if (e.key === "ArrowUp"){ mark(); selectAnimal(sixIx - 1); }
    else return;
    e.preventDefault();
  });
  $("#spinL").addEventListener("click", () => { mark(); frame = (frame + FRAMES - 3) % FRAMES; drawFrame(); });
  $("#spinR").addEventListener("click", () => { mark(); frame = (frame + 3) % FRAMES; drawFrame(); });
  $("#sixList").addEventListener("click", e => {
    const b = e.target.closest("[data-six]");
    if (b){ mark(); selectAnimal(+b.dataset.six); }
  });
  if (window.ResizeObserver) new ResizeObserver(sizeViewer).observe(v);
}

/* ===========================================================================
   Egoera eta URLa
=========================================================================== */
const STORE = "fauna.lang";
let urlTimer = null;
function stateHash(){
  const h = new URLSearchParams();
  h.set("lang", lang);
  if (filt !== "all") h.set("show", filt);
  if (q.trim()) h.set("q", q.trim());
  return "#" + h.toString();
}
function writeUrl(){
  clearTimeout(urlTimer);
  urlTimer = setTimeout(() => history.replaceState(null, "", stateHash()), 260);
}
function readUrl(){
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  const l = h.get("lang"); if (l === "eu" || l === "es") lang = l;
  const f = h.get("show"); if (["bird","mam","rep"].includes(f)) filt = f;
  const qq = h.get("q"); if (qq) q = qq;
}
function initLang(){
  let stored = null;
  try { stored = localStorage.getItem(STORE); } catch (e) {}
  if (stored === "eu" || stored === "es") lang = stored;
  else if ((navigator.language || "").toLowerCase().startsWith("es")) lang = "es";
  readUrl();
}
function setLang(l){
  if (l === lang) return;
  lang = l;
  try { localStorage.setItem(STORE, l); } catch (e) {}
  renderAll(); buildSteps(); updateHud(); paintWall(); writeUrl();
}

function wire(){
  document.querySelectorAll("[data-lang]").forEach(b =>
    b.addEventListener("click", () => setLang(b.dataset.lang)));
  document.querySelectorAll("[data-filt]").forEach(b => b.addEventListener("click", () => {
    filt = b.dataset.filt; paintTable(); writeUrl();
  }));
  let deb = null;
  $("#q").addEventListener("input", e => {
    clearTimeout(deb);
    const v = e.target.value;
    deb = setTimeout(() => { q = v; paintTable(); writeUrl(); }, 140);
  });
  $("#qclear").addEventListener("click", () => { $("#q").value=""; q=""; paintTable(); writeUrl(); $("#q").focus(); });
  $("#spTable thead").addEventListener("click", e => {
    const b = e.target.closest("[data-sort]");
    if (!b) return;
    const k = b.dataset.sort;
    if (k === sortKey) sortDir = -sortDir;
    else { sortKey = k; sortDir = (k === "sp" || k === "cls") ? 1 : -1; }
    paintTable();
  });
  $("#csv").addEventListener("click", downloadCsv);
  $("#pulsebox").addEventListener("keydown", e => {
    let m = pulseM;
    if (e.key === "ArrowRight") m = m < 0 ? 0 : Math.min(11, m + 1);
    else if (e.key === "ArrowLeft") m = m < 0 ? 11 : Math.max(0, m - 1);
    else if (e.key === "Escape"){ hidePulseTip(); return; }
    else return;
    e.preventDefault(); showMonth(m);
  });
  $("#pulsebox").addEventListener("blur", hidePulseTip);

  $("#share").addEventListener("click", async () => {
    const btn = $("#share"), label = btn.querySelector("span"), was = label.textContent;
    const url = location.origin + location.pathname + location.search + stateHash();
    try { await navigator.clipboard.writeText(url); } catch (e) { return; }
    label.textContent = T[lang].shared; btn.classList.add("ok");
    setTimeout(() => { label.textContent = was; btn.classList.remove("ok"); }, 1800);
  });

  window.addEventListener("hashchange", () => {
    const before = [lang, filt, q].join("|");
    readUrl();
    if ([lang, filt, q].join("|") === before) return;
    $("#q").value = q; renderAll(); buildSteps(); updateHud();
  });

  let rz = null;
  const remeasure = () => {
    clearTimeout(rz);
    rz = setTimeout(() => { sizeStage(); prepHero(); paintHero(1); drawPulse(); }, 160);
  };
  window.addEventListener("resize", remeasure);
  window.addEventListener("orientationchange", remeasure);
  if (window.ResizeObserver) new ResizeObserver(remeasure).observe($(".stage-gfx"));
}

function renderAll(){
  paintStatic();
  paintLadder();
  drawPulse();
  paintTable();
}

initLang();
wire();
$("#q").value = q;
renderAll();
buildSteps();
sizeStage();
setStep(0, true);
runHero();
wireViewer();
selectAnimal(0);
sizeViewer();
idleSpin();

/* Letra-tipoak kargatu arte canvas-eko etiketak ordezko batekin marrazten
   dira: kargatzean berriro marraztu, bestela neurriak ez datoz bat. */
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => { paintWall(); drawPulse(); });
}

})();
</script>
